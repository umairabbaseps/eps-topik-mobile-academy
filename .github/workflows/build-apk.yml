# EPS TOPIK Pro Pakistan — build the Flutter debug APK in GitHub Actions.
# The local VM cannot build it (JVM loopback TCP is reset below the
# permission layer, so Gradle daemon IPC fails). This workflow builds it
# in the cloud instead.
#
# Trigger: Actions tab -> "Build Flutter APK" -> Run workflow
#   (also runs automatically on every push to main)
# Result: Actions tab -> the run -> Artifacts -> app-debug-apk
#   (contains app-debug.apk, ready to install on Android)
#
# NOTE: the build will fail at asset bundling until the 3 binary assets
# are added to the repo via GitHub web drag-and-drop:
#   assets/logo.png, assets/logo-1024.png,
#   assets/fonts/NotoNastaliqUrdu.ttf
# They are referenced in pubspec.yaml but are not in the repo yet
# (the snapshot push used for the first commit accepts text files only).

name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.35.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
